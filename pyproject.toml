[project]
name = "tabasco-river-forecast"
version = "0.1.0"
description = "Probabilistic river stage forecasts for Tabasco rivers from public data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.7",
    "geopandas>=1.2.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numpy",
    "pandas",
    "pillow>=12.3.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riverforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixtures reproduce real station file lines verbatim.
"tests/*" = ["E501"]
